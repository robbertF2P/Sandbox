<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 620" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 12px; fill: #475569; }
      .state { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; }
      .state-reported { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
      .state-checked { fill: #fef9c3; stroke: #ca8a04; stroke-width: 1.5; }
      .state-approved { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .state-exported { fill: #f3e8ff; stroke: #9333ea; stroke-width: 1.5; }
      .state-rejected { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
      .state-draft { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .label { font-size: 13px; font-weight: 600; fill: #0f172a; }
      .detail { font-size: 10px; fill: #475569; }
      .perm { font-size: 9px; font-weight: 600; fill: #1d4ed8; }
      .line { stroke: #334155; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
      .line-green { stroke: #16a34a; stroke-width: 1.3; fill: none; marker-end: url(#arrow-green); }
      .line-red { stroke: #dc2626; stroke-width: 1.3; fill: none; marker-end: url(#arrow-red); }
      .legend-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
      .legend-title { font-size: 11px; font-weight: 700; fill: #0f172a; }
      .legend-item { font-size: 10px; fill: #475569; }
      .note { font-size: 10px; fill: #64748b; }
    </style>
  </defs>

  <text x="24" y="30" class="title">Submission lifecycle  permission-gated state machine</text>
  <text x="24" y="50" class="subtitle">Reported ’ Checked ’ Approved ’ Exported · every transition requires a valid state path and permission</text>

  <!-- Main path states -->
  <rect x="40" y="200" width="110" height="52" rx="10" class="state-draft"/>
  <text x="95" y="222" text-anchor="middle" class="label">Draft</text>
  <text x="95" y="238" text-anchor="middle" class="detail">editable</text>

  <rect x="200" y="200" width="120" height="52" rx="10" class="state-reported"/>
  <text x="260" y="222" text-anchor="middle" class="label">Reported</text>
  <text x="260" y="238" text-anchor="middle" class="detail">awaiting check</text>

  <rect x="380" y="200" width="120" height="52" rx="10" class="state-checked"/>
  <text x="440" y="222" text-anchor="middle" class="label">Checked</text>
  <text x="440" y="238" text-anchor="middle" class="detail">awaiting approval</text>

  <rect x="560" y="200" width="120" height="52" rx="10" class="state-approved"/>
  <text x="620" y="222" text-anchor="middle" class="label">Approved</text>
  <text x="620" y="238" text-anchor="middle" class="detail">ready for export</text>

  <rect x="740" y="200" width="120" height="52" rx="10" class="state-exported"/>
  <text x="800" y="222" text-anchor="middle" class="label">Exported</text>
  <text x="800" y="238" text-anchor="middle" class="detail">terminal</text>

  <!-- Rejected -->
  <rect x="380" y="380" width="120" height="52" rx="10" class="state-rejected"/>
  <text x="440" y="402" text-anchor="middle" class="label">Rejected</text>
  <text x="440" y="418" text-anchor="middle" class="detail">needs fix</text>

  <!-- Start / end -->
  <circle cx="20" cy="226" r="8" fill="#334155"/>
  <text x="20" y="250" text-anchor="middle" class="note">start</text>
  <circle cx="920" cy="226" r="10" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="920" cy="226" r="5" fill="#334155"/>
  <text x="920" y="250" text-anchor="middle" class="note">end</text>

  <!-- Main path arrows -->
  <path d="M 28 226 L 40 226" class="line"/>
  <path d="M 150 226 L 200 226" class="line-green"/>
  <text x="175" y="216" text-anchor="middle" class="detail">Submit</text>
  <text x="175" y="248" text-anchor="middle" class="perm">Hours.Report</text>

  <path d="M 320 226 L 380 226" class="line-green"/>
  <text x="350" y="216" text-anchor="middle" class="detail">CheckPass</text>
  <text x="350" y="248" text-anchor="middle" class="perm">Hours.Check</text>

  <path d="M 500 226 L 560 226" class="line-green"/>
  <text x="530" y="216" text-anchor="middle" class="detail">Approve</text>
  <text x="530" y="248" text-anchor="middle" class="perm">ApproveHoursProgress</text>

  <path d="M 680 226 L 740 226" class="line-green"/>
  <text x="710" y="216" text-anchor="middle" class="detail">Export</text>
  <text x="710" y="248" text-anchor="middle" class="perm">Hours.Export</text>

  <path d="M 860 226 L 910 226" class="line"/>

  <!-- Reject paths -->
  <path d="M 260 252 L 260 330 L 440 330 L 440 380" class="line-red"/>
  <text x="290" y="318" class="detail">CheckFail</text>
  <text x="290" y="330" class="perm">Hours.Check</text>

  <path d="M 440 252 L 440 280 L 560 280 L 560 252" class="line-red"/>
  <text x="500" y="272" text-anchor="middle" class="detail">Reject</text>
  <text x="500" y="294" text-anchor="middle" class="perm">ApproveHoursProgress</text>

  <!-- Resubmit -->
  <path d="M 380 406 L 260 406 L 260 252" class="line"/>
  <text x="310" y="396" class="detail">Resubmit</text>
  <text x="310" y="408" class="perm">Hours.Report</text>

  <!-- Send back -->
  <path d="M 400 252 L 400 170 L 260 170 L 260 200" class="line"/>
  <text x="330" y="162" text-anchor="middle" class="detail">SendBack</text>
  <text x="330" y="184" text-anchor="middle" class="perm">Hours.Check</text>

  <!-- Reopen -->
  <path d="M 620 252 L 620 120 L 260 120 L 260 200" class="line"/>
  <text x="440" y="110" text-anchor="middle" class="detail">Reopen</text>
  <text x="440" y="132" text-anchor="middle" class="perm">Hours.Reopen</text>

  <!-- Legend -->
  <rect x="24" y="480" width="992" height="120" rx="8" class="legend-box"/>
  <text x="44" y="504" class="legend-title">Permission constants</text>

  <text x="44" y="526" class="legend-item">Hours.Report  submit / resubmit (worker)</text>
  <text x="44" y="544" class="legend-item">Hours.Check  check pass, check fail, send back (team lead / foreman)</text>
  <text x="44" y="562" class="legend-item">ApproveHoursProgress  approve / reject (foreman / approver)</text>
  <text x="44" y="580" class="legend-item">Hours.Export  mark exported (payroll / integration service)</text>
  <text x="520" y="526" class="legend-item">Hours.Reopen  approved ’ reported amendment (site admin)</text>
  <text x="520" y="552" class="legend-title">Enforcement</text>
  <text x="520" y="570" class="legend-item">CanTransition(from, to) AND CanPerform(transition, permissions)</text>
  <text x="520" y="586" class="legend-item">Scope / ownership guards apply in application layer (not shown)</text>
</svg>
