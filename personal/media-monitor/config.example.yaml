# Copy to config.yaml and adjust paths/secrets.

output_dir: /opt/cursor/artifacts/media-monitor
state_file: /opt/cursor/artifacts/media-monitor/state.json

steam:
  api_key: ${STEAMAPIKEY}
  steam_id: ${STEAMID}
  country_code: nl
  # Tags to watch for new releases (matched against store search)
  watch_tags:
    - Action
    - Adventure
    - Puzzle
    - VR
    - Indie
  # Games you own or recently bought — boosts taste tags and shows in reports
  watch_games:
    - app_id: 870780
      name: CONTROL Ultimate Edition
      tags: [Action, Adventure]
      note: recently purchased
    - app_id: 918060
      name: "Obstruction : VR"
      tags: [Puzzle, VR, Indie, Casual]
      note: owned
  min_discount_percent: 25
  min_playtime_hours_for_tag_weight: 5

kindle:
  export_dir: ./kindle-data
  marketplace: www.amazon.nl
  amazon_domain: www.amazon.nl
  # Extra authors/series to watch beyond auto-detected profile
  watch_authors: []
  watch_series: []
  watch_keywords:
    - space opera
    - military science fiction
  min_reading_hours_for_author_weight: 3
  max_results_per_author: 5
